<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stay home - Admin & Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto pb-12">

    <div>
        <!-- VRCHNÁ ČASŤ -->
        <header class="py-4 text-center border-b border-neutral-900 mb-6">
            <div class="flex items-center justify-center space-x-0.5 mb-1">
                <span class="text-xl font-bold tracking-tight text-white">Stay</span>
                <span class="text-xl font-bold tracking-tight bg-orange-500 text-black px-1.5 py-0.5 rounded ml-0.5" style="background-color: #ff9900;">home</span>
            </div>
            <p class="text-[11px] text-neutral-400 font-medium">Admin & Video Manager</p>
        </header>

        <!-- STATUS MSG -->
        <div id="statusMsg" class="mb-4 text-center text-xs font-medium hidden p-3 rounded-xl border"></div>

        <!-- 1. VÝBER KATEGÓRIE -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-neutral-300 mb-2">1. Vyber kategóriu videa:</label>
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="selectCategory('social')" id="catSocial" class="py-3.5 rounded-2xl border border-neutral-800 bg-neutral-900 text-xs font-bold transition text-neutral-400 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>SocMedia</span>
                </button>
                <button type="button" onclick="selectCategory('phub')" id="catPhub" class="py-3.5 rounded-2xl border border-neutral-800 bg-neutral-900 text-xs font-bold transition text-neutral-400 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-fire text-orange-500"></i>
                    <span>Phub+</span>
                </button>
            </div>
        </div>

        <!-- 2. VLOŽENIE LINKU -->
        <div class="mb-5">
            <label class="block text-xs font-semibold text-neutral-300 mb-2">2. Vlož odkaz na video:</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-neutral-500">
                    <i class="fa-solid fa-link text-xs"></i>
                </span>
                <input type="text" id="videoLink" placeholder="https://cz.pornhub.com/view_video.php?viewkey=..." class="w-full bg-neutral-900 border border-neutral-800 rounded-2xl pl-10 pr-4 py-3 text-xs text-white focus:outline-none focus:border-orange-500 placeholder-neutral-600">
            </div>
        </div>

        <!-- TLAČIDLO SEND -->
        <button onclick="sendVideo()" class="w-full py-4 bg-orange-500 text-black font-bold rounded-2xl text-sm hover:opacity-95 transition shadow-lg shadow-orange-500/20 flex items-center justify-center space-x-2 mb-8" style="background-color: #ff9900;">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>SEND & Update Website</span>
        </button>

        <!-- ZOZNAM VIDEÍ NA SPRÁVU / ODSTRÁNENIE -->
        <div class="border-t border-neutral-900 pt-6">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-neutral-400">Správa existujúcich videí</h3>
                <button onclick="loadRepoData()" class="text-[11px] text-orange-400 hover:underline"><i class="fa-solid fa-rotate mr-1"></i> Obnoviť</button>
            </div>
            
            <div id="videoListContainer" class="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                <p class="text-xs text-neutral-500 text-center py-4">Načítavam zoznam videí...</p>
            </div>
        </div>

        <!-- SKRYTÉ NASTAVENIA S PREDVYPLNENÝM TOKENOM -->
        <input type="hidden" id="ghUser" value="captainandrej">
        <input type="hidden" id="ghRepo" value="stayhome">
        <input type="hidden" id="ghToken" value="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">
    </div>

    <script>
        let selectedCategory = '';
        let globalFileSha = '';
        let globalFileContent = '';
        const user = "captainandrej";
        const repo = "stayhome";
        const token = "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";

        window.onload = function() {
            loadRepoData();
        };

        function selectCategory(cat) {
            selectedCategory = cat;
            document.getElementById('catSocial').className = "py-3.5 rounded-2xl border border-neutral-800 bg-neutral-900 text-xs font-bold transition text-neutral-400 flex items-center justify-center space-x-2";
            document.getElementById('catPhub').className = "py-3.5 rounded-2xl border border-neutral-800 bg-neutral-900 text-xs font-bold transition text-neutral-400 flex items-center justify-center space-x-2";

            if (cat === 'social') {
                document.getElementById('catSocial').className = "py-3.5 rounded-2xl border border-orange-500 bg-orange-500/10 text-xs font-bold transition text-orange-400 shadow-md flex items-center justify-center space-x-2";
            } else {
                document.getElementById('catPhub').className = "py-3.5 rounded-2xl border border-orange-500 bg-orange-500/10 text-xs font-bold transition text-orange-400 shadow-md flex items-center justify-center space-x-2";
            }
        }

        async function loadRepoData() {
            const listContainer = document.getElementById('videoListContainer');
            listContainer.innerHTML = '<p class="text-xs text-neutral-500 text-center py-4">Načítavam zoznam videí...</p>';

            try {
                const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/index.html`;
                const res = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!res.ok) throw new Error("Neplatný token alebo zlý názov repozitára.");

                const fileData = await res.json();
                globalFileSha = fileData.sha;
                globalFileContent = decodeURIComponent(escape(atob(fileData.content)));

                parseAndDisplayVideos(globalFileContent);
            } catch (err) {
                listContainer.innerHTML = `<p class="text-xs text-rose-400 text-center py-4">Chyba: ${err.message}</p>`;
            }
        }

        function parseAndDisplayVideos(content) {
            const listContainer = document.getElementById('videoListContainer');
            listContainer.innerHTML = '';

            try {
                let phubStart = content.indexOf('const phubVideos = [');
                let phubEnd = content.indexOf('];', phubStart);
                let phubString = content.substring(phubStart, phubEnd + 2);
                
                let socStart = content.indexOf('const socialMediaPosts = [');
                let socEnd = content.indexOf('];', socStart);
                let socString = content.substring(socStart, socEnd + 2);

                let phubVideos = [];
                let socialMediaPosts = [];
                eval(phubString);
                eval(socString);

                let html = '';
                phubVideos.forEach((video) => {
                    html += `
                        <div class="bg-neutral-900 border border-neutral-800 p-3 rounded-xl flex items-center justify-between">
                            <div class="min-w-0 pr-2">
                                <span class="text-[10px] bg-orange-500/20 text-orange-400 font-bold px-1.5 py-0.5 rounded">Phub+</span>
                                <h4 class="text-xs font-semibold text-white truncate mt-1">${video.title}</h4>
                                <p class="text-[10px] text-neutral-400">${video.channel}</p>
                            </div>
                            <button onclick="deleteVideo('phub', '${video.id}')" class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 flex items-center justify-center flex-shrink-0 transition">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    `;
                });

                socialMediaPosts.forEach((post) => {
                    html += `
                        <div class="bg-neutral-900 border border-neutral-800 p-3 rounded-xl flex items-center justify-between">
                            <div class="min-w-0 pr-2">
                                <span class="text-[10px] bg-blue-500/20 text-blue-400 font-bold px-1.5 py-0.5 rounded">Social</span>
                                <h4 class="text-xs font-semibold text-white truncate mt-1">${post.title}</h4>
                                <p class="text-[10px] text-neutral-400">${post.channel}</p>
                            </div>
                            <button onclick="deleteVideo('social', '${post.id}')" class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 flex items-center justify-center flex-shrink-0 transition">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    `;
                });

                listContainer.innerHTML = html || '<p class="text-xs text-neutral-500 text-center py-4">Žiadne videá.</p>';
            } catch (e) {
                listContainer.innerHTML = '<p class="text-xs text-rose-400 text-center py-4">Chyba pri parsovaní zoznamu.</p>';
            }
        }

        async function sendVideo() {
            const statusBox = document.getElementById('statusMsg');
            const link = document.getElementById('videoLink').value.trim();

            statusBox.classList.remove('hidden', 'text-emerald-400', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-rose-400', 'bg-rose-500/10', 'border-rose-500/20');

            if (!selectedCategory) {
                statusBox.className = "mb-4 text-center text-xs font-medium text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl";
                statusBox.innerText = "⚠️ Vyber kategóriu!";
                return;
            }
            if (!link) {
                statusBox.className = "mb-4 text-center text-xs font-medium text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl";
                statusBox.innerText = "⚠️ Vlož odkaz!";
                return;
            }

            statusBox.className = "mb-4 text-center text-xs font-medium text-orange-400 bg-orange-500/10 border border-orange-500/20 p-3 rounded-xl";
            statusBox.innerText = "⏳ Pridávam video...";

            try {
                let viewkey = "";
                if (link.includes("viewkey=")) {
                    const urlParams = new URLSearchParams(link.split('?')[1]);
                    viewkey = urlParams.get('viewkey');
                } else if (link.includes("reel/")) {
                    const parts = link.split('/');
                    viewkey = parts[parts.indexOf('reel') + 1];
                }
                if (!viewkey) viewkey = "custom_" + Date.now();

                let updatedContent = globalFileContent;

                if (selectedCategory === 'phub') {
                    const newEntry = `            {\n                id: 'ph_${Date.now()}',\n                title: 'New Added Video',\n                channel: 'Pornhub Video',\n                duration: '15:00',\n                views: '100K views • New',\n                viewkey: '${viewkey}',\n                embedUrl: 'https://cz.pornhub.com/embed/${viewkey}'\n            },\n`;
                    updatedContent = updatedContent.replace('const phubVideos = [', 'const phubVideos = [\n' + newEntry);
                } else {
                    const newEntry = `            {\n                id: 'sm_${Date.now()}',\n                title: 'New Social Reel',\n                channel: '@stayhome_official',\n                embedUrl: '${link}',\n                aspect: '9/16'\n            },\n`;
                    updatedContent = updatedContent.replace('const socialMediaPosts = [', 'const socialMediaPosts = [\n' + newEntry);
                }

                await saveToGitHub(updatedContent, "Pridané video cez admin");
                statusBox.className = "mb-4 text-center text-xs font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-xl";
                statusBox.innerText = "✅ Úspešne pridané!";
                document.getElementById('videoLink').value = '';
                loadRepoData();
            } catch (err) {
                statusBox.className = "mb-4 text-center text-xs font-medium text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl";
                statusBox.innerText = "❌ Chyba: " + err.message;
            }
        }

        async function deleteVideo(category, id) {
            if (!confirm("Vymazať toto video?")) return;
            
            try {
                let phubStart = globalFileContent.indexOf('const phubVideos = [');
                let phubEnd = globalFileContent.indexOf('];', phubStart);
                let phubString = globalFileContent.substring(phubStart, phubEnd + 2);
                
                let socStart = globalFileContent.indexOf('const socialMediaPosts = [');
                let socEnd = globalFileContent.indexOf('];', socStart);
                let socString = globalFileContent.substring(socStart, socEnd + 2);

                let phubVideos = [];
                let socialMediaPosts = [];
                eval(phubString);
                eval(socString);

                let updatedContent = globalFileContent;
                if (category === 'phub') {
                    phubVideos = phubVideos.filter(v => v.id !== id);
                    updatedContent = updatedContent.replace(phubString, 'const phubVideos = ' + JSON.stringify(phubVideos, null, 4) + ';');
                } else {
                    socialMediaPosts = socialMediaPosts.filter(p => p.id !== id);
                    updatedContent = updatedContent.replace(socString, 'const socialMediaPosts = ' + JSON.stringify(socialMediaPosts, null, 4) + ';');
                }

                await saveToGitHub(updatedContent, "Vymazané video");
                loadRepoData();
            } catch (err) {
                alert("Chyba pri mazaní: " + err.message);
            }
        }

        async function saveToGitHub(newContent, message) {
            const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/index.html`;
            const encodedContent = btoa(unescape(encodeURIComponent(newContent)));
            
            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: message,
                    content: encodedContent,
                    sha: globalFileSha
                })
            });

            if (!putRes.ok) throw new Error("Chyba zápisu na GitHub.");
        }
    </script>
</body>
</html>
