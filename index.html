<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stay home - Mobile Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

    <!-- VRCHNÁ ČASŤ -->
    <div>
        <header class="py-4 text-center border-b border-neutral-900 mb-6">
            <div class="flex items-center justify-center space-x-0.5 mb-1">
                <span class="text-xl font-bold tracking-tight text-white">Stay</span>
                <span class="text-xl font-bold tracking-tight bg-orange-500 text-black px-1.5 py-0.5 rounded ml-0.5" style="background-color: #ff9900;">home</span>
            </div>
            <p class="text-[11px] text-neutral-400 font-medium">Mobile Admin Panel</p>
        </header>

        <!-- 1. VÝBER KATEGÓRIE -->
        <div class="mb-5">
            <label class="block text-xs font-semibold text-neutral-300 mb-2">1. Vyber kategóriu videa:</label>
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="selectCategory('social')" id="catSocial" class="py-3.5 rounded-2xl border border-neutral-800 bg-neutral-900 text-xs font-bold transition text-neutral-400 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>SocMedia</span>
                </button>
                <button type="button" onclick="selectCategory('phub')" id="catPhub" class="py-3.5 rounded-2xl border border-neutral-800 bg-neutral-900 text-xs font-bold transition text-neutral-400 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-fire text-orange-500"></i>
                    <span>Phub+</span>
                </button>
            </div>
        </div>

        <!-- 2. VLOŽENIE LINKU -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-neutral-300 mb-2">2. Vlož odkaz na video:</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-neutral-500">
                    <i class="fa-solid fa-link text-xs"></i>
                </span>
                <input type="text" id="videoLink" placeholder="https://cz.pornhub.com/view_video.php?viewkey=..." class="w-full bg-neutral-900 border border-neutral-800 rounded-2xl pl-10 pr-4 py-3 text-xs text-white focus:outline-none focus:border-orange-500 placeholder-neutral-600">
            </div>
        </div>

        <!-- SKRYTÉ NASTAVENIA (Token je už natvrdo uložený, aby si ho na mobile nemuselakaždýkrát vypisovať) -->
        <input type="hidden" id="ghUser" value="captainandrej">
        <input type="hidden" id="ghRepo" value="stayhome">
        <input type="hidden" id="ghToken" value="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">
    </div>

    <!-- SPODNÁ ČASŤ S TLAČIDLOM -->
    <div class="pb-6">
        <button onclick="sendVideo()" class="w-full py-4 bg-orange-500 text-black font-bold rounded-2xl text-sm hover:opacity-95 transition shadow-lg shadow-orange-500/20 flex items-center justify-center space-x-2" style="background-color: #ff9900;">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>SEND & Update Website</span>
        </button>

        <div id="statusMsg" class="mt-4 text-center text-xs font-medium hidden p-3 rounded-xl border"></div>
        
        <p class="text-[10px] text-neutral-600 text-center mt-6">
            Stay home Admin v1.0 • Direct GitHub API
        </p>
    </div>

    <script>
        let selectedCategory = '';

        function selectCategory(cat) {
            selectedCategory = cat;
            document.getElementById('catSocial').className = "py-3.5 rounded-2xl border border-neutral-800 bg-neutral-900 text-xs font-bold transition text-neutral-400 flex items-center justify-center space-x-2";
            document.getElementById('catPhub').className = "py-3.5 rounded-2xl border border-neutral-800 bg-neutral-900 text-xs font-bold transition text-neutral-400 flex items-center justify-center space-x-2";

            if (cat === 'social') {
                document.getElementById('catSocial').className = "py-3.5 rounded-2xl border border-orange-500 bg-orange-500/10 text-xs font-bold transition text-orange-400 shadow-md flex items-center justify-center space-x-2";
            } else {
                document.getElementById('catPhub').className = "py-3.5 rounded-2xl border border-orange-500 bg-orange-500/10 text-xs font-bold transition text-orange-400 shadow-md flex items-center justify-center space-x-2";
            }
        }

        async function sendVideo() {
            const statusBox = document.getElementById('statusMsg');
            const link = document.getElementById('videoLink').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            const user = document.getElementById('ghUser').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();

            statusBox.classList.remove('hidden', 'text-emerald-400', 'text-emerald-500/20', 'bg-emerald-500/10', 'text-rose-400', 'bg-rose-500/10', 'border-rose-500/20');

            if (!selectedCategory) {
                statusBox.className = "mt-4 text-center text-xs font-medium text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl";
                statusBox.innerText = "⚠️ Prosím vyber kategóriu (SocMedia alebo Phub+)!";
                return;
            }
            if (!link) {
                statusBox.className = "mt-4 text-center text-xs font-medium text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl";
                statusBox.innerText = "⚠️ Prosím vlož odkaz na video!";
                return;
            }

            statusBox.className = "mt-4 text-center text-xs font-medium text-orange-400 bg-orange-500/10 border border-orange-500/20 p-3 rounded-xl";
            statusBox.innerText = "⏳ Spracovávam a aktualizujem web...";

            try {
                const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/index.html`;
                const getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (!getRes.ok) throw new Error("Chyba pripojenia ku GitHub API.");

                const fileData = await getRes.json();
                let content = decodeURIComponent(escape(atob(fileData.content)));

                let viewkey = "";
                if (link.includes("viewkey=")) {
                    const urlParams = new URLSearchParams(link.split('?')[1]);
                    viewkey = urlParams.get('viewkey');
                } else if (link.includes("reel/")) {
                    const parts = link.split('/');
                    viewkey = parts[parts.indexOf('reel') + 1];
                }

                if (!viewkey) {
                    viewkey = "custom_" + Date.now();
                }

                if (selectedCategory === 'phub') {
                    const newEntry = `            {\n                id: 'ph_${Date.now()}',\n                title: 'New Added Video',\n                channel: 'Pornhub Video',\n                duration: '15:00',\n                views: '100K views • New',\n                viewkey: '${viewkey}',\n                embedUrl: 'https://cz.pornhub.com/embed/${viewkey}'\n            },\n`;
                    content = content.replace('const phubVideos = [', 'const phubVideos = [\n' + newEntry);
                } else {
                    const newEntry = `            {\n                id: 'sm_${Date.now()}',\n                title: 'New Social Reel',\n                channel: '@stayhome_official',\n                embedUrl: '${link}',\n                aspect: '9/16'\n            },\n`;
                    content = content.replace('const socialMediaPosts = [', 'const socialMediaPosts = [\n' + newEntry);
                }

                const encodedContent = btoa(unescape(encodeURIComponent(content)));
                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Pridané nové video (${selectedCategory}) cez mobilný admin`,
                        content: encodedContent,
                        sha: fileData.sha
                    })
                });

                if (!putRes.ok) throw new Error("Nepodarilo sa uložiť zmeny.");

                statusBox.className = "mt-4 text-center text-xs font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-xl";
                statusBox.innerText = "✅ Úspešne pridané! Web sa aktualizuje do 30 sekúnd.";
                document.getElementById('videoLink').value = '';

            } catch (err) {
                statusBox.className = "mt-4 text-center text-xs font-medium text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl";
                statusBox.innerText = "❌ Chyba: " + err.message;
            }
        }
    </script>
</body>
</html>
